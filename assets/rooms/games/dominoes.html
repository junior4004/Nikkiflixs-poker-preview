<html lang="en">

<style>@font-face{font-family:"Great Vibes Local";src:url("assets/great-vibes.ttf") format("truetype");font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--black);overflow:hidden}
body{font-family:"IBM Plex Sans",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.room::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.26;background-image:radial-gradient(circle at 10% 18%,#ffd588 0 1px,transparent 1.8px),linear-gradient(90deg,transparent 49.7%,#ffd58810 50%,transparent 50.3%);background-size:74px 74px,100% 100%}
.toolbar::-webkit-scrollbar{display:none}
.toolbar>*{flex:none}
.build-stamp{position:fixed;left:8px;bottom:8px;z-index:66;font:700 9px/1 sans-serif;letter-spacing:.08em;color:#a5936b;background:#000a;padding:4px 6px;border-radius:6px;pointer-events:none}
.toolbar-spacer{flex:1}
.tool{height:42px;min-width:42px;padding:0 12px;border-radius:8px;border:1px solid #ffffff2f;background:#19191e;box-shadow:0 4px 10px #0009;font-weight:800;cursor:pointer}
.tool.gold{border-color:#e5ba53;color:#ffe79b;background:#241a0d}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool .wide-label{margin-left:6px;font-size:10px}
.seat{position:absolute;inset:0;z-index:14;pointer-events:none}
@property --arc{syntax:"<angle>";inherits:false;initial-value:1turn}
.timer-bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#7ed957;transform-origin:left center;display:none;z-index:3}
.seat.active .nameplate{border-color:#7ed957;box-shadow:0 6px 12px #000e,0 0 10px #7ed95766}
.seat.active.warning .nameplate{border-color:#e33;box-shadow:0 6px 12px #000e,0 0 10px #e33366}
.seat.active .timer-bar{display:block;animation:nameplateDrain 20s linear forwards}
.seat.active.warning .timer-bar{background:#e33;animation-duration:10s}
.seat.authoritative.active .timer-bar{animation-duration:var(--turn-green,20s)}
.seat.authoritative.active.warning .timer-bar{animation-duration:var(--turn-red,10s)}
@keyframes nameplateDrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.nameplate strong,.nameplate span{display:block;white-space:nowrap}
.seat.folded .portrait{filter:grayscale(.5) brightness(.8)}
.seat.folded .nameplate::after{content:"FOLDED";position:absolute;inset:0;display:grid;place-items:center;border-radius:7px;background:#090708e8;color:#ffbdc2;font:800 13px/1 "Barlow Condensed";letter-spacing:.08em}
.sit-in{display:none;position:absolute;inset:4px;border:1px solid #f3cf6d;border-radius:6px;background:linear-gradient(180deg,#b8872d,#654216);color:#fff9df;font:800 14px/1 "Barlow Condensed";letter-spacing:.05em;cursor:pointer;pointer-events:auto}
.seat.empty-seat .sit-in{display:block}
body.mp-spectating .sit-in{display:block}
.seat.empty-seat .stack-value{visibility:hidden}
.seat.empty-seat.folded .nameplate::after,.seat.you.folded .nameplate::after{display:none}
.seat.out-of-chips .nameplate::after{content:"OUT OF CHIPS";position:absolute;inset:0;place-items:center;border-radius:7px;background:#24080bed;color:#ffe09a;font:800 12px/1 "Barlow Condensed";letter-spacing:.06em;display:grid}
.seat.empty-seat .portrait{filter:grayscale(.45) brightness(.7)}
.seat.empty-seat .seat-chips,.seat.empty-seat .pocket{display:none}
.seat.you.empty-seat .seat-chips,.seat.you.empty-seat .pocket{display:flex}
.blind{position:absolute;z-index:4;right:-12px;top:68px;min-width:34px;height:34px;padding:0 4px;display:none;place-items:center;border-radius:50%;background:#f5d46d;color:#2c1900;border:3px solid #8f6515;box-shadow:0 0 0 3px #130a08,0 4px 10px #000d,0 0 10px #f5d46d80;font:800 12px/1 "Barlow Condensed"}
.blind.show{display:grid}
.hole.red{color:#c20f25}
.hole::after{content:attr(data-suit);position:absolute;right:4px;bottom:4px;font-size:.82em}
.hole.back{background:linear-gradient(135deg,transparent 0 8%,#f1c55a 8% 12%,transparent 12% 20%,#f1c55a 20% 24%,transparent 24%),#650d1d;border:2px solid #f3d999;box-shadow:inset 0 0 0 2px #640919,0 5px 9px #000c}
.hole.back::after{content:""}
.seat-chips i::before,.pot-chips i::before,.bet-stack i::before{content:"";position:absolute;left:13%;top:7%;width:50%;height:36%;border-radius:50%;background:linear-gradient(180deg,#ffffffd9,#ffffff00);transform:rotate(-14deg);pointer-events:none}
.seat-chips i:nth-child(1){bottom:0;transform:rotate(-3deg)}
.seat-chips i:last-child::after{content:"NF";position:absolute;inset:0;display:grid;place-items:center;font:italic 700 8px Georgia,'Times New Roman',serif;letter-spacing:.05em;color:#43300a;text-shadow:0 0 2px #fff8;opacity:.9}
.seat-chips.empty{opacity:.22}
.pot-chips i{position:absolute;width:32px;height:16px;border-radius:50%;border:3px dashed #fffdf4;background:radial-gradient(ellipse at 34% 28%,#ffffff 0 7%,#f9e3e7 11% 19%,#b01e37 25% 57%,#7d1223 61% 88%,#570a17 100%);box-shadow:0 2px 0 #2a050c,0 4px 3px #00000059,inset 0 0 0 2px #ffd76a4d,inset 0 3px 4px #ffffff73,inset 0 -4px 5px #00000059;transform:rotate(-3deg)}
.pot-chips i:nth-child(1){left:4px;bottom:0}
.pot-chips i:nth-child(2){left:30px;bottom:1px;transform:rotate(4deg);background:radial-gradient(ellipse at 34% 28%,#ffffff 0 7%,#e6f2ff 11% 19%,#1f6fc4 25% 57%,#0b3f7d 61% 88%,#072c57 100%)}
.pot-chips i:nth-child(3){left:56px;bottom:0;transform:rotate(-6deg);background:radial-gradient(ellipse at 34% 28%,#ffffff 0 7%,#fff3c4 11% 19%,#dda520 25% 57%,#8a5f07 61% 88%,#5f4104 100%)}
.pot-chips i:nth-child(4){left:18px;bottom:12px;transform:rotate(3deg);background:radial-gradient(ellipse at 34% 28%,#ffffff 0 7%,#e6f2ff 11% 19%,#1f6fc4 25% 57%,#0b3f7d 61% 88%,#072c57 100%)}
.pot-chips i:nth-child(5){left:44px;bottom:13px;transform:rotate(-2deg);background:radial-gradient(ellipse at 34% 28%,#ffffff 0 7%,#fff3c4 11% 19%,#dda520 25% 57%,#8a5f07 61% 88%,#5f4104 100%)}
.pot-chips i:nth-child(6){left:31px;bottom:26px;transform:rotate(5deg)}
.pot-chips i:last-child::after{content:"NF";position:absolute;inset:0;display:grid;place-items:center;font:italic 700 8px Georgia,'Times New Roman',serif;letter-spacing:.05em;color:#43300a;text-shadow:0 0 2px #fff8;opacity:.9}
.board-card.red{color:#c20f25}
.board-card::after{content:attr(data-suit);position:absolute;right:4px;bottom:4px;font-size:.82em}
.muck.show{opacity:1}
.muck i{position:absolute;inset:0;border-radius:4px;background:linear-gradient(135deg,transparent 0 8%,#f1c55a 8% 12%,transparent 12% 20%,#f1c55a 20% 24%,transparent 24%),#650d1d;border:2px solid #f3d999;box-shadow:0 4px 8px #000c}
.muck i:nth-child(2){transform:translate(4px,-2px) rotate(7deg)}
.deck.show{opacity:1}
.deck i{position:absolute;inset:0;border-radius:5px;background:linear-gradient(135deg,transparent 0 8%,#f1c55a 8% 12%,transparent 12% 20%,#f1c55a 20% 24%,transparent 24%),#650d1d;border:2px solid #f3d999;box-shadow:inset 0 0 0 2px #640919,0 4px 8px #000b}
.deck i:nth-child(2){transform:translate(3px,-3px)}
.deck i:nth-child(3){transform:translate(6px,-6px)}
.deck.shuffle i:nth-child(1){animation:shuffleL .38s ease-in-out 5}
.deck.shuffle i:nth-child(2){animation:shuffleR .38s ease-in-out 5}
.deck.shuffle i:nth-child(3){animation:shuffleT .38s ease-in-out 5}
@keyframes shuffleL{50%{transform:translate(-34px,5px) rotate(-14deg)}}
@keyframes shuffleR{50%{transform:translate(38px,-2px) rotate(15deg)}}
@keyframes shuffleT{50%{transform:translate(6px,-22px) rotate(6deg)}}
.motion{position:absolute;inset:0;z-index:25;pointer-events:none}
.flying-card,.fold-card{--dx:0px;--dy:0px;position:absolute;width:32px;height:46px;border-radius:5px;background:linear-gradient(135deg,transparent 0 8%,#f1c55a 8% 12%,transparent 12% 20%,#f1c55a 20% 24%,transparent 24%),#650d1d;border:2px solid #f3d999;box-shadow:inset 0 0 0 2px #640919,0 5px 9px #000d}
.flying-card{animation:deal .42s cubic-bezier(.2,.75,.25,1) forwards}
.fold-card{animation:fold .72s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes deal{from{transform:translate(0,0) rotate(-7deg) scale(.86)}to{transform:translate(var(--dx),var(--dy)) rotate(0) scale(1)}}
@keyframes fold{0%{transform:translate(0,0) rotate(0);opacity:1}75%{transform:translate(calc(var(--dx)*.8),calc(var(--dy)*.8 - 13px)) rotate(210deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(350deg) scale(.35);opacity:0}}
.flying-chip{--dx:0px;--dy:0px;position:absolute;width:20px;height:10px;border-radius:50%;border:2px dashed #fffdf4;background:#b01e37;box-shadow:0 3px 8px #000c;animation:chipMove .56s cubic-bezier(.2,.75,.25,1) forwards}
.flying-chip.blue{background:#1f6fc4}
.flying-chip.gold{background:#dda520}
@keyframes chipMove{to{transform:translate(var(--dx),var(--dy)) rotate(340deg);opacity:.3}}
.bet-layer{position:absolute;inset:0;z-index:24;pointer-events:none}
.round-bet.show{opacity:1}
.round-bet.collecting{animation:collectBet .88s cubic-bezier(.25,.72,.24,1) forwards}
.bet-stack i:nth-child(1){bottom:0}
.bet-stack i:nth-child(4){transform:rotate(2deg)}
.round-bet.collecting .bet-amount{animation:fadeBetAmount .32s ease forwards}
@keyframes collectBet{0%{transform:translate(-50%,-50%);opacity:1}78%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.92);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.62);opacity:0}}
@keyframes fadeBetAmount{to{opacity:0}}
.pot-flight{--dx:0px;--dy:0px;position:absolute;width:104px;height:58px;transform:translate(-50%,-50%);animation:awardPot 1.35s cubic-bezier(.18,.76,.2,1) forwards;filter:drop-shadow(0 0 13px #ffd45e) drop-shadow(0 8px 8px #000e)}
.pot-flight .bet-stack{left:35px;top:4px;transform:scale(1.55)}
.pot-flight .bet-amount{left:50%;top:43px;transform:translateX(-50%);min-width:88px;text-align:center;font-size:13px;background:#3a2409f4}
.pot-flight i:nth-child(4){position:absolute;left:10px;bottom:20px;width:25px;height:13px;border-radius:50%;border:2.5px dashed #fff8d3;background:radial-gradient(ellipse at 34% 28%,#ffffff 0 7%,#e6f2ff 11% 19%,#216dbd 25% 57%,#0b3f7d 61% 88%,#072c57 100%);box-shadow:0 2px 0 #102746,0 3px 2px #00000059,inset 0 2px 3px #ffffff70,inset 0 -3px 4px #00000055}
@keyframes awardPot{0%{transform:translate(-50%,-50%) scale(.82);opacity:1}18%{transform:translate(-50%,-65%) scale(1.18)}82%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) - 12px)) scale(1.05);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.78);opacity:0}}
.talk.talking{background:#8f1724;border-color:#ff8790;color:#fff}
.action.call{border-color:#e2b34f;background:linear-gradient(180deg,#b8872d,#654216)}
.action.raise{border-color:#ee6a72;background:linear-gradient(180deg,#b63b46,#621720)}
.action:disabled{opacity:.38;cursor:not-allowed}
.action:active:not(:disabled){transform:translateY(1px)}
.toast{position:fixed;z-index:90;left:50%;bottom:88px;width:max-content;max-width:min(420px,calc(100% - 24px));transform:translate(-50%,8px);opacity:0;pointer-events:none;padding:9px 14px;border-radius:12px;background:#08090cf2;border:1px solid #ffffff35;font-size:11px;line-height:1.4;text-align:center;white-space:normal;transition:.18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.connection-state{position:fixed;z-index:82;left:50%;top:70px;display:none;transform:translateX(-50%);padding:7px 12px;border-radius:999px;border:1px solid #ef737d;background:#4d0b14f2;color:#fff4e2;box-shadow:0 5px 15px #000c;font:800 10px/1 "Barlow Condensed";letter-spacing:.06em;white-space:nowrap}
.connection-state.show{display:block}
.connection-state.restored{border-color:#f5cf6d;background:#2b200df2;color:#ffeaa1}
.modal{position:fixed;z-index:100;inset:0;display:none;place-items:center;grid-template-columns:minmax(0,100%);justify-content:center;padding:18px;background:#000c}
.modal.open{display:grid}
.panel{position:relative;width:min(390px,calc(100vw - 36px));padding:20px;border:1px solid #d8a94b;border-radius:12px;background:linear-gradient(180deg,#21181a,#090708);box-shadow:0 20px 60px #000}
.panel h2{margin:0 0 7px;font:800 25px/1 "Barlow Condensed"}
.panel p{margin:0 0 14px;color:#e7d9ca;font-size:12px;line-height:1.45}
.close{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff35;background:#171315;font-size:20px;cursor:pointer}
.balance-row{display:flex;justify-content:space-between;padding:10px 0;border-block:1px solid #ffffff25;font-size:13px}
.balance-row b{color:#ffd46f}
.panel label{display:block;margin-top:14px;font-size:12px;font-weight:700}
.panel input{width:100%;margin:10px 0;accent-color:#bc2632}
.amount{font:800 21px/1 "Barlow Condensed";color:#ffd46f}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.modal-actions button{min-height:42px;border-radius:7px;border:1px solid #ffffff35;background:#22242a;font-weight:800;font-size:10px}
.modal-actions .primary{background:#9b741f;border-color:#e8bf5b}
.modal-actions .leave{grid-column:1/-1;background:#681b23;border-color:#d45762}
.cashier-note{display:none;margin-top:10px;padding:9px;border-radius:7px;background:#160e10;color:#ffe0a0;font-size:10px}
.cashier-note.show{display:block}
.raise-readout{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 8px;padding:12px 14px;border:1px solid #ffffff30;border-radius:8px;background:#0b090a}
.raise-readout span{color:#d9cab9;font-size:11px;font-weight:700}
.raise-readout output{color:#ffd46f;font:800 26px/1 "Barlow Condensed"}
.raise-slider{width:100%;height:28px;margin:0 0 12px;accent-color:#d44a54;cursor:pointer}
.raise-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.raise-option{min-height:46px;padding:7px 5px;border:1px solid #ffffff38;border-radius:8px;background:#201b1e;text-align:center;cursor:pointer}
.raise-option strong{display:block;font:800 11px/1 "Barlow Condensed";letter-spacing:.03em}
.raise-option span{display:block;margin-top:5px;color:#ffd46f;font:800 15px/1 "Barlow Condensed"}
.raise-option.selected{border-color:#f0c75d;background:#4b251b;box-shadow:inset 0 0 0 1px #f0c75d}
.raise-confirm{width:100%;min-height:44px;margin-top:12px;border:1px solid #f27b84;border-radius:7px;background:linear-gradient(180deg,#b63b46,#621720);font-weight:800;cursor:pointer}
.raise-confirm:disabled{opacity:.38;cursor:not-allowed}
.raise-cancel{width:100%;min-height:38px;margin-top:8px;border:1px solid #ffffff35;border-radius:7px;background:#22242a;font-weight:800;cursor:pointer}
@media(max-width:620px){.toolbar{height:58px;padding-inline:8px;gap:6px}.stage{inset:58px 0 112px}.tool{height:38px;min-width:38px;padding:0 9px}.tool .wide-label{display:none}.controls{width:100%;border-radius:0}.talk{min-width:112px}.action{height:42px;font-size:10px}.toast{bottom:106px}.camera{width:740px;height:1120px}.table{left:20%;top:36%;width:60%;height:27%}.brand{top:50%;font-size:88px}.dealer{left:64%;top:29%}.deck{left:62%;top:40%}.pot{top:45%}.board{top:52%}.muck{top:44%}}

<script>
'use strict';
/* Nikkiflixs Dominoes — 2-player double-six draw game on the no-dealer racetrack.
   RULES (as built):
   - Standard double-six set (28 tiles), 7 tiles each, 14 in the boneyard.
   - Highest double starts; if nobody holds a double, the highest pip-sum tile
     starts (tie-break: higher single pip). The starter's tile is played to the
     centre automatically.
   - A tile plays on an open end it matches. TAP a tile: it goes to the
     CLOSEST matching open end automatically (nearest your seat). DRAG a
     tile to an end to choose it; a non-matching end rejects it with a hint
     and the tile snaps back. (Old tap-tile-then-tap-end flow removed.)
   - Chain tiles auto-shrink as the chain grows (chain length -> tile scale,
     re-measured on every render) so the whole chain stays on the felt.
   - TAP TO TALK is a latching toggle on ONE click only (no pointerdown/up
     handlers): tap once ON, tap again OFF, a long hold never flickers it.
   - No ADMIN button on this table at all: admin lives only in the creator
     sign-on (PIN) flow before the table; nothing at the top or in any bar.
   - No playable tile: draw from the boneyard one at a time until you can play.
     Boneyard empty and still nothing playable: PASS.
   - Round ends the moment a player plays their LAST domino (domino!) — that
     player wins and scores the opponent's remaining pips. If both players are
     blocked (boneyard empty, neither can play), lowest pip count wins and
     scores the difference; a pip tie scores nothing.
   - Match: first to 100 points. */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MATCH_TARGET = 100;

const PIP_POS = {
  tl: [18, 18], tr: [82, 18], ml: [18, 50], mr: [82, 50],
  bl: [18, 82], br: [82, 82], c: [50, 50]
};
const PIP_MAP = {
  0: [], 1: ['c'], 2: ['tl', 'br'], 3: ['tl', 'c', 'br'],
  4: ['tl', 'tr', 'bl', 'br'], 5: ['tl', 'tr', 'c', 'bl', 'br'],
  6: ['tl', 'tr', 'ml', 'mr', 'bl', 'br']
};
function pipHTML(v) {
  return PIP_MAP[v].map(k => {
    const p = PIP_POS[k];
    return '<span class="pip" style="left:' + p[0] + '%;top:' + p[1] + '%"></span>';
  }).join('');
}
function tileInner(a, b, vertical) {
  // vertical: top half = a, bottom half = b. horizontal: left = a, right = b.
  return '<div class="half">' + pipHTML(a) + '</div><div class="half">' + pipHTML(b) + '</div>';
}
function pips(t) { return t[0] + t[1]; }
function tileKey(t) { return t[0] + '-' + t[1]; }
function sortHand(h) {
  return h.slice().sort((x, y) => (pips(y) - pips(x)) || (Math.max(y[0], y[1]) - Math.max(x[0], x[1])) || (y[0] - x[0]));
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

let S = null;
function freshState() {
  // Harness hook: ?speed=N presets the bot delay (60000 freezes the bot so a
  // fresh deal can be read exactly as dealt; 0 makes bot moves instant).
  let speed = 650;
  try {
    const q = new URLSearchParams(location.search).get('speed');
    if (q !== null && q !== '' && !isNaN(parseInt(q, 10))) speed = parseInt(q, 10);
  } catch (e) { /* location.search unavailable — keep default */ }
  return {
    round: 1, scores: { you: 0, andre: 0 }, roundsWon: { you: 0, andre: 0 },
    you: [], andre: [], boneyard: [], chain: [],
    turn: 'you', phase: 'play', passes: 0,
    winner: null, winReason: null, lastPoints: 0, matchOver: false,
    speed: 650, talkOn: false, chainScale: 1, log: [], _botPromise: null
  };
}
function log(type, detail) {
  S.log.push({ type, detail, t: Date.now() });
  if (S.log.length > 200) S.log.splice(0, S.log.length - 200);
}
function leftEnd() { return S.chain.length ? S.chain[0].a : null; }
function rightEnd() { return S.chain.length ? S.chain[S.chain.length - 1].b : null; }
function handOf(who) { return who === 'you' ? S.you : S.andre; }
function playableTiles(hand) {
  const le = leftEnd(), re = rightEnd();
  if (le === null) return hand.slice();
  return hand.filter(t => t[0] === le || t[1] === le || t[0] === re || t[1] === re);
}
function matchingEnds(t) {
  const le = leftEnd(), re = rightEnd(), out = [];
  if (le === null) return ['L'];
  if (t[0] === le || t[1] === le) out.push('L');
  if (t[0] === re || t[1] === re) out.push('R');
  return out;
}
function pickBest(tiles) {
  return sortHand(tiles)[0];
}

function dealRound() {
  const deck = [];
  for (let a = 0; a <= 6; a++) for (let b = a; b <= 6; b++) deck.push([a, b]);
  shuffle(deck);
  S.you = deck.splice(0, 7);
  S.andre = deck.splice(0, 7);
  S.boneyard = deck;
  S.chain = [];
  S.passes = 0;
  S.winner = null; S.winReason = null; S.lastPoints = 0;
  S.phase = 'play';
  // Starter: highest double; else highest pip-sum tile.
  function bestStart(hand) {
    const doubles = hand.filter(t => t[0] === t[1]);
    if (doubles.length) return { tile: sortHand(doubles)[0], rule: 'highest double' };
    return { tile: sortHand(hand)[0], rule: 'highest tile (no doubles)' };
  }
  const ys = bestStart(S.you), as = bestStart(S.andre);
  let starter, startTile, rule;
  const cmp = (x, y) => (pips(x.tile) - pips(y.tile)) || (Math.max(x.tile[0], x.tile[1]) - Math.max(y.tile[0], y.tile[1]));
  if (ys.tile[0] === ys.tile[1] && as.tile[0] === as.tile[1]) {
    if (ys.tile[0] >= as.tile[0]) { starter = 'you'; startTile = ys.tile; rule = ys.rule; }
    else { starter = 'andre'; startTile = as.tile; rule = as.rule; }
  } else if (ys.tile[0] === ys.tile[1]) { starter = 'you'; startTile = ys.tile; rule = ys.rule; }
  else if (as.tile[0] === as.tile[1]) { starter = 'andre'; startTile = as.tile; rule = as.rule; }
  else if (cmp(ys, as) >= 0) { starter = 'you'; startTile = ys.tile; rule = ys.rule; }
  else { starter = 'andre'; startTile = as.tile; rule = as.rule; }
  const hand = handOf(starter);
  hand.splice(hand.findIndex(t => tileKey(t) === tileKey(startTile)), 1);
  S.chain = [{ a: startTile[0], b: startTile[1] }];
  S.turn = starter === 'you' ? 'andre' : 'you';
  log('round-start', { round: S.round, starter, tile: startTile, rule });
  setStatus((starter === 'you' ? 'You start' : 'Andre starts') + ' with [' + startTile[0] + '|' + startTile[1] + '] — ' + rule + '.');
  render();
  if (S.turn === 'andre') scheduleBot();
}

function newGame() {
  S = freshState();
  dealRound();
}

function endRound(winner, reason) {
  S.phase = 'over';
  S.winner = winner;
  S.winReason = reason;
  const youPips = S.you.reduce((s, t) => s + pips(t), 0);
  const andrePips = S.andre.reduce((s, t) => s + pips(t), 0);
  let points = 0, msg = '';
  if (reason === 'domino') {
    points = winner === 'you' ? andrePips : youPips;
    S.scores[winner] += points;
    S.roundsWon[winner]++;
    msg = (winner === 'you' ? 'DOMINO! You played your last tile' : 'Andre played his last tile') +
      ' — ' + (winner === 'you' ? 'you win' : 'Andre wins') + ' the round +' + points + ' points.';
  } else if (reason === 'blocked') {
    if (youPips === andrePips) {
      msg = 'Blocked game — dead even at ' + youPips + ' pips each. No points.';
      points = 0; S.winner = null;
    } else {
      winner = youPips < andrePips ? 'you' : 'andre';
      S.winner = winner;
      points = Math.abs(andrePips - youPips);
      S.scores[winner] += points;
      S.roundsWon[winner]++;
      msg = 'Blocked game — ' + (winner === 'you' ? 'you hold fewer pips' : 'Andre holds fewer pips') +
        ' (' + youPips + ' vs ' + andrePips + ') — ' + (winner === 'you' ? 'you win' : 'Andre wins') + ' +' + points + ' points.';
    }
  }
  S.lastPoints = points;
  if (S.winner && S.scores[S.winner] >= MATCH_TARGET) {
    S.matchOver = true;
    msg += '  🏆 ' + (S.winner === 'you' ? 'YOU WIN THE MATCH!' : 'ANDRE WINS THE MATCH!');
  }
  log('round-over', { winner: S.winner, reason, points, scores: { you: S.scores.you, andre: S.scores.andre } });
  setStatus(msg);
  toast(msg);
  render();
}

/* Play tile [a,b] for `who` onto end 'L' or 'R'. Returns {ok, reason?, won?}. */
function playTile(who, a, b, end) {
  if (S.phase !== 'play') return { ok: false, reason: 'round-over' };
  if (S.turn !== who) return { ok: false, reason: 'not-your-turn' };
  const hand = handOf(who);
  const idx = hand.findIndex(t => (t[0] === a && t[1] === b) || (t[0] === b && t[1] === a));
  if (idx < 0) return { ok: false, reason: 'not-in-hand' };
  const tile = hand[idx];
  const ends = matchingEnds(tile);
  if (!ends.length) return { ok: false, reason: 'no-match' };
  if (end && ends.indexOf(end) < 0) return { ok: false, reason: 'no-match-' + end };
  if (!end) end = ends[0];
  // Remove FIRST, then check for the empty hand — the last domino must end the round.
  hand.splice(idx, 1);
  const le = leftEnd(), re = rightEnd();
  let entry;
  if (S.chain.length === 0) entry = { a: tile[0], b: tile[1] };
  else if (end === 'R') entry = tile[0] === re ? { a: tile[0], b: tile[1] } : { a: tile[1], b: tile[0] };
  else entry = tile[1] === le ? { a: tile[0], b: tile[1] } : { a: tile[1], b: tile[0] };
  if (end === 'L') S.chain.unshift(entry); else S.chain.push(entry);
  S.passes = 0;
  log('play', { who, tile, end, chain: S.chain.length });
  if (hand.length === 0) {
    render();
    endRound(who, 'domino');
    return { ok: true, won: true };
  }
  S.turn = who === 'you' ? 'andre' : 'you';
  render();
  if (S.turn === 'andre') scheduleBot();
  return { ok: true };
}

function drawTile(who) {
  if (S.phase !== 'play') return { ok: false, reason: 'round-over' };
  if (S.turn !== who) return { ok: false, reason: 'not-your-turn' };
  if (!S.boneyard.length) return { ok: false, reason: 'boneyard-empty' };
  if (playableTiles(handOf(who)).length) return { ok: false, reason: 'has-playable' };
  const t = S.boneyard.pop();
  handOf(who).push(t);
  log('draw', { who, tile: t, boneyard: S.boneyard.length });
  render();
  return { ok: true, tile: t };
}

function passTurn(who) {
  if (S.phase !== 'play') return { ok: false, reason: 'round-over' };
  if (S.turn !== who) return { ok: false, reason: 'not-your-turn' };
  if (playableTiles(handOf(who)).length) return { ok: false, reason: 'has-playable' };
  if (S.boneyard.length) return { ok: false, reason: 'boneyard-not-empty' };
  S.passes++;
  log('pass', { who, passes: S.passes });
  if (S.passes >= 2) {
    render();
    endRound(null, 'blocked');
    return { ok: true, blocked: true };
  }
  S.turn = who === 'you' ? 'andre' : 'you';
  render();
  if (S.turn === 'andre') scheduleBot();
  return { ok: true };
}

function newRound() {
  if (S.phase !== 'play' && S.phase === 'over') {
    if (S.matchOver) {
      S.scores = { you: 0, andre: 0 };
      S.roundsWon = { you: 0, andre: 0 };
      S.round = 1;
      S.matchOver = false;
    } else {
      S.round++;
    }
    dealRound();
    return { ok: true, round: S.round };
  }
  return { ok: false, reason: 'round-not-over' };
}

/* ---- Bot (Andre) ---- */
async function botDelay() {
  // Chunked delay: re-reads S.speed every 50ms, so setSpeed(0) (or a state
  // change) shortens a long pending wait instead of sleeping through it.
  let waited = 0;
  while (waited < S.speed) {
    await sleep(50);
    waited += 50;
    if (S.phase !== 'play' || S.turn !== 'andre') return;
  }
}
function runBotTurns() {
  if (S._botPromise) return S._botPromise;
  S._botPromise = (async () => {
    while (S.phase === 'play' && S.turn === 'andre') {
      await botDelay();
      if (S.phase !== 'play' || S.turn !== 'andre') break;
      const pl = playableTiles(S.andre);
      if (pl.length) {
        const t = pickBest(pl);
        const ends = matchingEnds(t);
        const end = ends.length > 1 ? (leftEnd() >= rightEnd() ? 'L' : 'R') : ends[0];
        playTile('andre', t[0], t[1], end);
      } else if (S.boneyard.length) {
        drawTile('andre');
      } else {
        passTurn('andre');
      }
      render();
    }
  })().finally(() => { S._botPromise = null; });
  return S._botPromise;
}
function scheduleBot() { runBotTurns(); }

/* ---- Rendering ---- */

function renderHands() {

  const thA = Math.round(twA * 1.7);

  const x0a = (370 - totalA) / 2;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'dom-back';
    d.style.left = (x0a + i * (twA + gap)) + 'px';
    d.style.top = '0px';
    d.style.width = twA + 'px';
    d.style.height = thA + 'px';

  $('#andreTileCount').textContent = S.andre.length + (S.andre.length === 1 ? ' tile' : ' tiles');
}

function renderChain() {
  const box = $('#domChain');
  box.innerHTML = '';
  const n = S.chain.length;
  if (!n) return;
  const W = 324, H = 282, gap = 10;
  // Auto-shrink: chain length -> tile scale, re-measured on every render
  // (every play / draw / remove). Base tile 64x38 (1:1.68); doubles 38x64.
  const baseTw = 64, baseTh = 38, baseRowH = 70;
  let tw = baseTw, th = baseTh, rowH = baseRowH;
  // Greedy row assignment (doubles are vertical: width th, height tw).
  function assign(tw2, th2, rowH2) {
    const rows = [[]];
    let x = 0;
    S.chain.forEach((e, i) => {
      const w = e.a === e.b ? th2 : tw2;
      if (x > 0 && x + w > W) { rows.push([]); x = 0; }
      rows[rows.length - 1].push({ e, i, w });
      x += w + gap;
    });
    return rows;
  }
  let scale = n <= 8 ? 1 : Math.max(0.45, 1 - 0.03 * (n - 8));
  let rows = assign(Math.round(baseTw * scale), Math.round(baseTh * scale), Math.round(baseRowH * scale));
  while (rows.length * Math.round(baseRowH * scale) > H && scale > 0.4) {
    scale = Math.max(0.4, scale - 0.05);
    rows = assign(Math.round(baseTw * scale), Math.round(baseTh * scale), Math.round(baseRowH * scale));
  }
  tw = Math.round(baseTw * scale); th = Math.round(baseTh * scale); rowH = Math.round(baseRowH * scale);
  S.chainScale = scale;
  rows.forEach((row, r) => {
    const rowW = row.reduce((s, c) => s + c.w, 0) + (row.length - 1) * gap;
    let x = (W - rowW) / 2;
    const ltr = r % 2 === 0;
    const cells = ltr ? row : row.slice().reverse();
    cells.forEach(cell => {
      const e = cell.e, dbl = e.a === e.b;
      const d = document.createElement('div');
      d.className = 'dom-tile ' + (dbl ? 'vert' : 'horiz');
      if (cell.i === 0) { d.classList.add('chain-end'); d.dataset.end = 'L'; }
      if (cell.i === n - 1) { d.classList.add('chain-end'); d.dataset.end = 'R'; }
      d.style.width = (dbl ? th : tw) + 'px';
      d.style.height = (dbl ? tw : th) + 'px';
      d.style.left = x + 'px';
      const y = r * rowH + (rowH - (dbl ? tw : th)) / 2;
      d.style.top = y + 'px';
      if (dbl) d.innerHTML = tileInner(e.a, e.b, true);
      else if (ltr) d.innerHTML = tileInner(e.a, e.b, false);
      else d.innerHTML = tileInner(e.b, e.a, false);
      d.setAttribute('aria-label', 'Chain domino ' + e.a + ' ' + e.b);
      box.appendChild(d);
      x += cell.w + gap;
    });
  });
}

function renderInfo() {
  const le = leftEnd(), re = rightEnd();
  $('#domEnds').textContent = le === null ? 'ENDS — · —' : 'ENDS ◀ ' + le + ' · ' + re + ' ▶';
  $('#boneyardCount').textContent = 'BONNYARD ' + S.boneyard.length;
  $('#domScore').textContent = 'R' + S.round + ' · YOU ' + S.scores.you + ' · ANDRE ' + S.scores.andre + (S.matchOver ? ' · MATCH OVER' : '');
  $('#heroSeat').classList.toggle('active', S.phase === 'play' && S.turn === 'you');
  $('#andreSeat').classList.toggle('active', S.phase === 'play' && S.turn === 'andre');
  const heroPlayable = S.phase === 'play' && S.turn === 'you' ? playableTiles(S.you) : [];
  const canDraw = S.phase === 'play' && S.turn === 'you' && !heroPlayable.length && S.boneyard.length > 0;
  const canPass = S.phase === 'play' && S.turn === 'you' && !heroPlayable.length && S.boneyard.length === 0;
  $('#drawBtn').disabled = !canDraw;
  $('#boneyardBtn').disabled = !canDraw;
  $('#passBtn').disabled = !canPass;
  const nr = $('#newRoundBtn');
  nr.disabled = S.phase !== 'over';
  nr.textContent = S.matchOver ? 'NEW MATCH' : 'NEW ROUND';
  if (S.phase === 'play') {
    if (S.turn === 'you') {
      if (heroPlayable.length) setStatus('Your turn — tap a glowing tile to play it.');
      else if (S.boneyard.length) setStatus('Your turn — no match in hand. DRAW from the boneyard.');
      else setStatus('Your turn — boneyard is empty and nothing matches. PASS.');
    } else {
      setStatus('Andre is thinking…');
    }
  }
}

function render() { renderHands(); renderChain(); renderInfo(); }

// TAP = play to the CLOSEST matching open end (nearest your seat, bottom).
// DRAG = press-hold, slide to the end you want, release to drop there.
// The old tap-tile-then-tap-an-end-tile / LEFT-RIGHT picker flow is gone.
let dragState = null, suppressTileClick = false, dragGhost = null;
function closestEnd() {
  const hero = $('#heroHand');
  const hr = hero ? hero.getBoundingClientRect() : null;
  const hx = hr ? hr.left + hr.width / 2 : innerWidth / 2;
  const hy = hr ? hr.top : innerHeight;
  let best = null, bestD = Infinity;
  document.querySelectorAll('#domChain .dom-tile.chain-end').forEach(el => {
    const r = el.getBoundingClientRect();
    const d = Math.hypot((r.left + r.width / 2) - hx, (r.top + r.height / 2) - hy);
    if (d < bestD) { bestD = d; best = el.dataset.end; }
  });
  return best || 'R';
}
function onHeroTileClick(a, b, el) {
  if (suppressTileClick) { suppressTileClick = false; return; }
  if (S.phase !== 'play' || S.turn !== 'you') return;
  const t = [a, b];
  const ends = matchingEnds(t);
  if (!ends.length) { toast('That tile matches neither open end (' + leftEnd() + ' / ' + rightEnd() + ').'); return; }
  const end = ends.length === 1 ? ends[0] : closestEnd();
  playTile('you', a, b, end);
}
function onHeroTilePointerDown(ev, a, b, el) {
  if (S.phase !== 'play' || S.turn !== 'you') return;
  dragState = { a, b, el, x0: ev.clientX, y0: ev.clientY, dragging: false, pointerId: ev.pointerId };
}
function dragMove(ev) {
  if (!dragState) return;
  if (!dragState.dragging && Math.hypot(ev.clientX - dragState.x0, ev.clientY - dragState.y0) > 10) {
    dragState.dragging = true;
    dragState.el.classList.add('drag-src');
    dragGhost = document.createElement('div');
    dragGhost.className = 'dom-tile vert dom-drag-ghost';
    dragGhost.innerHTML = dragState.el.innerHTML;
    document.body.appendChild(dragGhost);
    document.querySelectorAll('#domChain .dom-tile.chain-end').forEach(e2 => e2.classList.add('drop-target'));
  }
  if (dragState.dragging && dragGhost) {
    dragGhost.style.left = ev.clientX + 'px';
    dragGhost.style.top = ev.clientY + 'px';
  }
}
function dragEnd(ev) {
  if (!dragState) return;
  const ds = dragState; dragState = null;
  if (dragGhost) { dragGhost.remove(); dragGhost = null; }
  document.querySelectorAll('#domChain .dom-tile.chain-end').forEach(e2 => e2.classList.remove('drop-target'));
  ds.el.classList.remove('drag-src');
  if (!ds.dragging) return; // plain tap: the click handler plays it
  suppressTileClick = true; // swallow the click that follows a drag
  setTimeout(() => { suppressTileClick = false; }, 350);
  const t = [ds.a, ds.b];
  const ends = matchingEnds(t);
  let hit = null;
  document.querySelectorAll('#domChain .dom-tile.chain-end').forEach(el => {
    const r = el.getBoundingClientRect();
    if (ev.clientX >= r.left - 14 && ev.clientX <= r.right + 14 && ev.clientY >= r.top - 14 && ev.clientY <= r.bottom + 14) hit = el.dataset.end;
  });
  if (!hit) { toast('Drop on an open end tile to play — tile back in hand.'); render(); return; }
  if (ends.indexOf(hit) < 0) {
    const need = hit === 'L' ? leftEnd() : rightEnd();
    toast('That end shows ' + need + ' — your [' + t[0] + '|' + t[1] + '] does not match it. Try the other end.');
    render();
    return;
  }
  playTile('you', t[0], t[1], hit);
}

/* ---- UI wiring ---- */
function wire() {

    else if (r.ok && r.tile) {

      if (pl.length) setStatus('You drew [' + r.tile[0] + '|' + r.tile[1] + '] — it plays! Tap a glowing tile.');

window.__dominoesTest = {

    if (spec.scores) S.scores = { you: spec.scores.you || 0, andre: spec.scores.andre || 0 };
    if (spec.round) S.round = spec.round;
    S.phase = 'play'; S.passes = 0; S.winner = null; S.winReason = null;
    S.lastPoints = 0; S.matchOver = false;
    render();
    return getState();
  }
};

wire();
newGame();

</script>
