<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Craps · Nikkiflixs Table Games</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap');
@font-face{font-family:"Great Vibes Local";src:url("../poker/assets/great-vibes.ttf") format("truetype");font-weight:400;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Source Sans 3",sans-serif;background:#0b0507;color:#f8f2df;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% -10%,#33101c 0%,#0b0507 60%)}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0d0508f2;border-bottom:1px solid #7a5a24}
.topbar .back{min-height:42px;padding:8px 14px;border:1px solid #7a5a24;background:#1c0d12;color:#f8f2df;border-radius:8px;font-weight:700}
.topbar h1{margin:0;font:800 22px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;color:#f6d36f;flex:1}
.bal{background:#0a0406;border:1px solid #7a5a24;border-radius:8px;padding:6px 10px;text-align:right}
.bal small{display:block;color:#c9a86a;font-size:9px;letter-spacing:.14em}
.bal strong{font:800 20px/1 "Barlow Condensed",sans-serif;color:#f5c65a;font-variant-numeric:tabular-nums}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:8px 10px 16px}
.dice-area{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 4px;position:relative;padding-top:10px}
.dice-area::before{content:"THROW UP THE TABLE ↑";position:absolute;top:-4px;left:50%;transform:translateX(-50%);font:700 9px/1 "Barlow Condensed",sans-serif;letter-spacing:.24em;color:#ffffff60;white-space:nowrap}
.die{width:62px;height:62px;border-radius:13px;background:#150509;box-shadow:0 12px 24px #000e,0 3px 6px #000a,inset 0 0 0 2px #d49a54,inset 0 2px 6px #ffffff14;overflow:hidden;flex:none}
.die img.die-img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
/* v29: real dice throw — dice travel across the felt, tumbling, then settle with a bounce */
.die{--dx:0px;--dy:0px;--rr:360deg}
.die.throwing{animation:diceThrow .95s cubic-bezier(.25,.7,.35,1) forwards}
@keyframes diceThrow{
  0%{transform:translate(0,0) rotate(0deg)}
  25%{transform:translate(calc(var(--dx)*.35),calc(var(--dy)*.35 - 26px)) rotate(calc(var(--rr)*.4))}
  55%{transform:translate(calc(var(--dx)*.75),calc(var(--dy)*.75 - 8px)) rotate(calc(var(--rr)*.75))}
  75%{transform:translate(calc(var(--dx)*.95),calc(var(--dy)*.95 - 12px)) rotate(calc(var(--rr)*.92))}
  88%{transform:translate(var(--dx),var(--dy)) rotate(var(--rr))}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rr))}}
.die.landed{transform:translate(var(--dx),var(--dy)) rotate(var(--rr))}
.pip{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a3a,#0a0a0a 70%);place-self:center;visibility:hidden;box-shadow:inset 0 2px 3px #000,0 1px 1px #ffffff80}
.puck{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font:800 12px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.06em;border:3px solid #cfd4d6;background:radial-gradient(circle at 35% 30%,#fff,#c9ced2 60%,#8a9094);color:#222;box-shadow:0 6px 14px #000c;text-align:center}
.puck.on{background:radial-gradient(circle at 35% 30%,#3a3a3a,#0a0a0a 65%);color:#fff;border-color:#fff}
.puck small{display:block;font-size:9px;letter-spacing:.2em}
.roll-row{text-align:center;margin:4px 0}
.roll{padding:10px 44px;border-radius:12px;border:1px solid #ffe9a8;background:linear-gradient(135deg,#fff7c8 0%,#f5c65a 40%,#c67b1c 100%);color:#1e1003;font:800 19px/1 "Barlow Condensed",sans-serif;letter-spacing:.1em;box-shadow:0 10px 26px #000c,inset 0 2px 3px #ffffff90,inset 0 -2px 4px #00000020;text-shadow:0 1px 1px #ffffff60}
.roll:disabled{opacity:.4}
.msg{min-height:28px;text-align:center;font:700 13px/1.4 "Source Sans 3",sans-serif;color:#ffe9bd;margin:4px 0}
.msg.win{color:#7dff9f}.msg.lose{color:#ff9a9a}
.chip-row{display:flex;gap:8px;justify-content:center;align-items:center;margin:4px 0}
.chip{width:46px;height:46px;border-radius:50%;border:3px dashed #fff8d3;font:800 12px/1 "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 2px 3px #000;box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 0 0 2px #ffffff26;display:grid;place-items:center}
.chip.c5{background:radial-gradient(ellipse,#f5d9de 0 18%,#bd2038 19% 56%,#74101f 57%)}
.chip.c25{background:radial-gradient(ellipse,#d9edff 0 18%,#1767b9 19% 56%,#0a3a78 57%)}
.chip.c100{background:radial-gradient(ellipse,#fff1bd 0 18%,#d69c19 19% 56%,#875a08 57%);color:#2a1c05;text-shadow:0 1px 2px #fff8}
.chip.sel{outline:3px solid #ffe27a;box-shadow:0 0 14px #ffe27a88,0 4px 0 rgba(0,0,0,.5)}
.clearbtn{min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid #7a5a24;background:#1c0d12;color:#ffe9bd;font-weight:700;font-size:13px}
/* ===== REAL CASINO CRAPS TABLE — TALL VERTICAL OVAL BOAT (donor #1, red velvet) ===== */
.craps-table{border-radius:50%/12.5%;padding:13px;background:linear-gradient(145deg,#8a5a2e 0%,#4a2c12 24%,#96682f 50%,#3c2410 76%,#7d5326 100%);box-shadow:0 30px 48px #000d,0 12px 0 #1f0b05,0 18px 0 #080402,0 0 0 3px #080302,inset 0 2px 6px #ffffff40,inset 0 -4px 8px #00000070;margin-top:6px}
.craps-felt{border-radius:50%/11%;padding:30px 26px 34px;position:relative;
  background:#4a0a16 url("../poker/assets/red-velvet-felt.jpg") center/cover no-repeat;
  box-shadow:inset 0 0 0 3px #d49a54,inset 0 0 0 999px rgba(24,3,8,.34),inset 0 0 90px #000000a0,inset 0 4px 4px #ffd08380,inset 0 -18px 34px rgba(10,0,2,.55);
  overflow:hidden}
.craps-felt::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff05 3px 4px),repeating-linear-gradient(90deg,transparent 0 3px,#00000008 3px 4px)}
.craps-felt::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:50%/10%;
  background:radial-gradient(ellipse at 50% 0%,#ffffff14 0%,transparent 45%)}
.craps-wordmark{font-family:"Great Vibes Local","Great Vibes",cursive;font-size:clamp(38px,11vw,54px);line-height:1;text-align:center;color:#f6d36f;text-shadow:0 3px 4px #41000b,0 0 16px rgba(255,211,97,.5);padding:2px 0 0;position:relative;z-index:1;pointer-events:none}
.craps-wordmark-sub{text-align:center;font:700 9px/1 "Barlow Condensed",sans-serif;letter-spacing:.42em;color:#ffe9b0cc;margin:4px 0 10px;position:relative;z-index:1;text-shadow:0 1px 2px #000}
.felt-row{position:relative;z-index:1}
.bet-box{background:#00000038;border:2px solid #ffe9b0e6;border-radius:7px;color:#f7efdb;font:700 11px/1.25 "Barlow Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 4px;position:relative;text-shadow:0 1px 3px #000;min-height:46px}
.bet-box small{font-size:9.5px;color:#ffe9bd;letter-spacing:.03em;text-transform:none;font-family:"Source Sans 3",sans-serif;font-weight:600}
.bet-box .amt{font:800 15px/1 "Barlow Condensed",sans-serif;color:#ffe27a;text-shadow:0 0 8px #ffe27a66}
.bet-box.has-bet{border-color:#ffe27a;box-shadow:0 0 12px #ffe27a55,inset 0 0 12px #ffe27a22}
.bet-box:disabled{opacity:.35}
.bet-box .sub2{font-size:8.5px;color:#ffe9bd;letter-spacing:.08em}
/* Don't pass bar — sits just inside the pass line, near the player */
.dp-bar{margin:0 5% 6px}
.dp-bar .bet-box{min-height:36px;border-radius:20px;letter-spacing:.18em;font-size:12px}
/* Point number boxes */
.pts-row{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 2.5% 6px}
.pts-row .bet-box{min-height:50px;border-width:2.5px}
.pts-row .bet-box .pnum{font:800 19px/1 "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 2px 4px #000}
.pts-row .bet-box .pword{font-size:8px;letter-spacing:.08em;color:#ffe9bd}
/* Come / Don't come */
.come-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.come-box{min-height:48px;border:2.5px solid #f5edd8d9;border-radius:10px;background:#00000028}
.come-box .ctitle{font:800 17px/1 "Barlow Condensed",sans-serif;letter-spacing:.14em;color:#fff;text-shadow:0 2px 4px #000}
/* Hardways */
.hw-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px}
.hw-row .bet-box{min-height:46px}
.hw-row .hw-t{font:800 12px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.06em}
.hw-row .hw-dice{font-size:14px;letter-spacing:.1em;color:#ffe9bd}
/* Field strip */
.field-strip{margin-bottom:6px;border:2.5px solid #f5edd8d9;border-radius:10px;background:#00000028;padding:5px 4px;text-align:center}
.field-strip .f-title{font:800 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.3em;color:#fff;text-shadow:0 2px 4px #000;margin-bottom:2px}
.field-strip .f-nums{display:flex;justify-content:center;gap:8px;font:800 14px/1 "Barlow Condensed",sans-serif;color:#ffe9bd;letter-spacing:.04em;margin-bottom:3px}
.field-strip .f-nums .dbl{color:#fff;background:#ffffff22;border:1px solid #ffffff55;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px}
.field-strip .bet-box{border:none;background:transparent;min-height:0;padding:2px}
.field-strip .f-note{font-size:9px;color:#ffe9bd;letter-spacing:.06em}
/* Pass line bar across the bottom */
.pl-bar{margin:2px 3.5% 0}
.pl-bar .bet-box{min-height:42px;border-radius:20px;letter-spacing:.22em;font-size:14px;border-width:2.5px;background:#00000038}
.felt-caption{text-align:center;font:700 8px/1 "Barlow Condensed",sans-serif;letter-spacing:.26em;color:#ffffff90;text-transform:uppercase;margin:5px 0 4px;position:relative;z-index:1;text-shadow:0 1px 2px #000}
.rules{margin-top:10px;padding:10px 12px;border:1px solid #7a5a24;border-radius:10px;background:#0d0508cc;font-size:12px;color:#c9b995;line-height:1.5}
.rules summary{cursor:pointer;font-weight:700;color:#ddb866;touch-action:manipulation}
.rules b{color:#ddb866}
/* v35-FUN: throwables + emotes + gifts live on a separate tap layer — gameplay untouched */
.fun-targetable{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fun-targetable.fun-target{box-shadow:0 0 0 3px #ff6b6b,0 0 22px #ff6b6bcc;border-radius:12px}
.fun-targetable.fun-target::after{content:"🎯";position:absolute;right:4px;top:-16px;font-size:22px;filter:drop-shadow(0 2px 3px #000);pointer-events:none;z-index:5}
.funbtn{min-height:42px;padding:8px 12px;border-radius:8px;font-weight:700;border:1px solid #8a6a2f;background:#1a1510;color:#ffe9bd;white-space:nowrap}
.tipbtn{min-height:42px;padding:8px 12px;border-radius:8px;font-weight:700;border:1px solid #e3b85f;background:#2b1a0d;color:#ffe9bd;white-space:nowrap}
.tip-modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:#000a}
.tip-modal.open{display:flex}
.tip-box{background:#171008;border:1px solid #d5aa57;border-radius:12px;padding:22px;width:min(340px,90vw);text-align:center;color:#ffe9bd}
.tip-box h3{margin:0 0 6px;color:#f4d68d;font-size:20px}
.tip-box p{margin:0 0 14px;color:#cbb995;font-size:13px}
.tip-amounts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tip-amt{min-height:48px;border:1px solid #8a6a2f;background:#25180d;color:#ffe9bd;font-weight:800;font-size:16px;border-radius:8px;cursor:pointer}
.tip-amt:active{background:#3a2410}
.tip-custom{display:flex;gap:8px;margin-bottom:12px}
.tip-custom input{flex:1;min-height:44px;padding:0 10px;border:1px solid #77613f;background:#050403;color:#fff;border-radius:8px;font-size:16px}
.tip-custom button{min-height:44px;padding:0 16px;border:1px solid #e2bd6c;background:#831b24;color:#fff8e8;font-weight:800;border-radius:8px;cursor:pointer}
.tip-cancel{width:100%;min-height:44px;border:1px solid #5e452a;background:transparent;color:#cbb995;border-radius:8px;cursor:pointer}
.tip-thanks{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);z-index:2001;background:#171008;border:2px solid #e3b85f;border-radius:14px;padding:18px 28px;color:#ffe9bd;font-size:20px;font-weight:800;opacity:0;pointer-events:none;transition:all .3s}
.tip-thanks.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fun-tray{position:fixed;z-index:96;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:#0e0a0df5;border:1px solid #d8a94b;box-shadow:0 12px 32px #000e;transition:opacity .18s,transform .18s;max-width:94vw;overflow-x:auto}
.fun-tray.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.fun-tray .fun-label{font:800 10px/1.25 "Barlow Condensed",sans-serif;color:#ffd98a;letter-spacing:.06em;text-align:center;flex:none}
.fun-throw{position:relative;width:54px;height:54px;flex:none;border-radius:13px;border:1px solid #ffffff2c;background:linear-gradient(180deg,#241b1e,#120d10);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;padding:0;font-size:32px}
.fun-throw:active{transform:scale(.9)}
.fun-throw svg{width:40px;height:40px;pointer-events:none}
.fun-throw.locked{opacity:.5;filter:grayscale(.7)}
.fun-lock{position:absolute;right:2px;bottom:2px;font-size:14px;pointer-events:none}
.fun-x{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid #ffffff35;background:#2a2124;color:#fff;font-size:15px;cursor:pointer;touch-action:manipulation}
.emote-picker,.gift-picker{position:fixed;z-index:96;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;display:grid;grid-template-columns:repeat(4,58px);gap:8px;padding:12px;border-radius:16px;background:#0e0a0df5;border:1px solid #d8a94b;box-shadow:0 12px 32px #000e;transition:opacity .18s,transform .18s}
.emote-picker.open,.gift-picker.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.emote-btn{width:58px;height:58px;border-radius:13px;border:1px solid #ffffff2c;background:linear-gradient(180deg,#241b1e,#120d10);font-size:34px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;padding:0}
.emote-btn:active{transform:scale(.9)}
.gift-btn{position:relative;width:58px;height:58px;border-radius:13px;border:1px solid #ffffff2c;background:linear-gradient(180deg,#241b1e,#120d10);font-size:30px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;padding:0}
.gift-btn:active{transform:scale(.9)}
.gift-btn .gcount{position:absolute;right:2px;bottom:2px;min-width:20px;height:20px;border-radius:10px;background:#d8a94b;color:#1a1005;font:800 12px/20px "Barlow Condensed",sans-serif;text-align:center;padding:0 4px}
.gift-btn.empty{opacity:.4;filter:grayscale(.8)}
.emote-pop{position:absolute;z-index:27;pointer-events:none;font-size:54px;line-height:1;transform:translate(-50%,-100%);filter:drop-shadow(0 6px 10px #000d);animation:emoteIn .45s cubic-bezier(.2,1.5,.35,1) both,emoteOut .5s ease 2.7s both;white-space:nowrap}
@keyframes emoteIn{0%{transform:translate(-50%,-100%) scale(0) rotate(-14deg)}70%{transform:translate(-50%,-100%) scale(1.28) rotate(6deg)}100%{transform:translate(-50%,-100%) scale(1) rotate(0)}}
@keyframes emoteOut{to{opacity:0;transform:translate(-50%,-135%) scale(.85)}}
.fun-proj{position:absolute;z-index:27;pointer-events:none;will-change:transform}
.fun-proj svg{display:block;filter:drop-shadow(0 6px 6px #000a)}
.fun-gift-proj{position:absolute;z-index:27;pointer-events:none;font-size:46px;line-height:1;filter:drop-shadow(0 8px 8px #000c);will-change:transform}
.fun-particle{position:absolute;z-index:27;pointer-events:none;border-radius:50%;will-change:transform,opacity}
.fun-splat{position:absolute;z-index:27;pointer-events:none;transform:translate(-50%,-50%);animation:splatIn .18s ease-out both,splatOut .6s ease 2.2s both}
@keyframes splatIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes splatOut{to{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
.fun-smoke{position:absolute;z-index:27;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#9a9a9acc 0%,#6a6a6a66 55%,transparent 70%);animation:smokeUp 1.1s ease-out both}
@keyframes smokeUp{from{transform:translate(-50%,-50%) scale(.5);opacity:.9}to{transform:translate(-50%,-160%) scale(1.6);opacity:0}}
.fun-shake{animation:funShake .32s linear}
@keyframes funShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.fun-targetable.fun-wobble{animation:funWobble .55s ease}
@keyframes funWobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}}
.gift-pop{position:absolute;z-index:28;pointer-events:none;font-size:64px;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 12px #000d);animation:giftPop 1.6s ease both}
@keyframes giftPop{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25) rotate(8deg);opacity:1}45%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
@media(prefers-reduced-motion:reduce){.emote-pop,.fun-splat,.fun-smoke,.fun-shake,.fun-targetable.fun-wobble,.gift-pop,.fun-minicard{animation-duration:.001ms!important}}
.fun-flagbadge{position:absolute;z-index:26;pointer-events:none;transform:translate(-50%,-50%);font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px #000a);animation:flagIn .3s ease-out both}
@keyframes flagIn{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.flag-state{display:inline-block;min-width:30px;padding:2px 6px;border-radius:6px;background:#1a2a5e;color:#fff;font-size:13px;font-weight:700;text-align:center;border:1px solid #d8a94b;font-family:system-ui,sans-serif}
.fun-splat.fun-sprayx{animation:splatIn .18s ease-out both,sprayxOut .8s ease 2.8s both}
@keyframes sprayxOut{to{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
.fun-minicard{position:absolute;z-index:28;pointer-events:none;background:#fffdf4;border:1px solid #b8a888;border-radius:4px;font:700 13px/1.2 sans-serif;color:#1a1a1a;padding:3px 5px;transform:translate(-50%,-50%);box-shadow:0 3px 6px #0008;white-space:nowrap}

.motion{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:visible}
.you-badge{width:52px;height:52px;border-radius:50%;border:2px solid #ffe9a8;background:#141c26;cursor:pointer;touch-action:manipulation;position:relative;flex:none;padding:0;overflow:hidden}
.you-badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.you-badge span{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);background:#000a;padding:1px 5px;border-radius:6px;font:800 8px/1 "Barlow Condensed",sans-serif;color:#ffe9bd;letter-spacing:.08em;z-index:1}

</style>
<style>
.wrap{position:relative;max-width:760px;margin:0 auto;padding:8px 8px 120px}
.rail{position:relative;border-radius:34px;padding:14px;background:linear-gradient(180deg,#3a1a10,#1d0b06 45%,#2c130a);box-shadow:inset 0 2px 0 #ffffff22,0 12px 30px #000c;border:2px solid #120604}
.seats{display:flex;justify-content:space-around;margin:0 0 8px}
.seat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:80px;color:#f8f2df;font:700 13px/1.1 "Source Sans 3",sans-serif;position:relative}
.seat .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 20px/1 "Barlow Condensed",sans-serif;color:#fff;border:2px solid #e6c46c;box-shadow:0 3px 8px #000b}
.seat .bk{color:#f6d36f;font-size:12px}.seat .sb{font-size:11px;color:#cfe8cf;min-height:13px}
.seat.shooter .av{box-shadow:0 0 0 3px #ffd84a,0 0 18px #ffd84a}

function funNoise(dur,freq,vol,fType){
  var ctx=funCtx();if(!ctx)return;
  try{
    var len=Math.max(1,Math.floor(ctx.sampleRate*dur)),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);

  }catch(e){}
}
function funTone(f0,f1,dur,vol,oType){

    o.type=oType||'sine';o.frequency.setValueAtTime(Math.max(1,f0),ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),ctx.currentTime+dur);

  }catch(e){}
}

function resolveRoll(a,b){
 var t=a+b,hard=a===b,log=[],won=0,lost=0;
 function W(k,mult,lab){var s=bets[k];if(!s)return;var w=Math.floor(s*mult);balance+=s+w;won+=w;bets[k]=0;log.push(lab+' +'+fmt(w));}
 function L(k,lab){var s=bets[k];if(!s)return;lost+=s;bets[k]=0;log.push(lab+' lost');}
 botsResolve(t);
 // one-roll
 if(bets.field){if(t===2||t===12)W('field',2,'Field '+t);else if([3,4,9,10,11].indexOf(t)>-1)W('field',1,'Field '+t);else L('field','Field');}
 if(t===7)W('any7',4,'Any 7');else L('any7','Any 7');
 if(t===2||t===3||t===12)W('anyCraps',7,'Any Craps');else L('anyCraps','Any Craps');
 [[2,30],[3,15],[11,15],[12,30]].forEach(function(p){if(t===p[0])W('p'+p[0],p[1],p[0]+'!');else L('p'+p[0],p[0]+'');});
 // hardways
 [4,6,8,10].forEach(function(n){var k='hard'+n;if(!bets[k])return;if(t===n&&hard)W(k,n===4||n===10?7:9,'Hard '+n);else if(t===7||t===n)L(k,'Hard '+n);});
 // big 6/8
 [6,8].forEach(function(n){var k='big'+n;if(t===n)W(k,1,'Big '+n);else if(t===7)L(k,'Big '+n);});
 if(phase==='comeout'){
  if(bets.pass){if(t===7||t===11)W('pass',1,'Pass Line');else if(t===2||t===3||t===12)L('pass','Pass Line');}
  if(bets.dontPass){if(t===2||t===3)W('dontPass',1,'Don\'t Pass');else if(t===7||t===11)L('dontPass','Don\'t Pass');else if(t===12)log.push('Don\'t Pass push (bar 12)');}
  if([4,5,6,8,9,10].indexOf(t)>-1){point=t;phase='point';log.push('Point is '+t+' — puck ON');}
 }else{
  var made=t===point,seven=t===7;
  [4,5,6,8,9,10].forEach(function(n){var k='place'+n;if(t===n)W(k,n===4||n===10?9/5:n===5||n===9?7/5:7/6,'Place '+n);else if(seven)L(k,'Place '+n);});
  comeBets=comeBets.filter(function(c){if(t===c.n){balance+=c.amt*2;won+=c.amt;log.push('Come '+c.n+' +'+fmt(c.amt));return false;}if(seven){lost+=c.amt;log.push('Come '+c.n+' lost');return false;}return true;});
  dcBets=dcBets.filter(function(c){if(seven){balance+=c.amt*2;won+=c.amt;log.push('Don\'t Come '+c.n+' +'+fmt(c.amt));return false;}if(t===c.n){lost+=c.amt;log.push('Don\'t Come '+c.n+' lost');return false;}return true;});
  if(bets.come){if(t===7||t===11)W('come',1,'Come');else if(t===2||t===3||t===12)L('come','Come');else{comeBets.push({n:t,amt:bets.come});log.push('Come moves to '+t);bets.come=0;}}
  if(bets.dontCome){if(t===2||t===3)W('dontCome',1,'Don\'t Come');else if(t===7||t===11)L('dontCome','Don\'t Come');else if(t===12)log.push('Don\'t Come push');else{dcBets.push({n:t,amt:bets.dontCome});log.push('Don\'t Come moves to '+t);bets.dontCome=0;}}
  if(made){var om=point===4||point===10?2:point===5||point===9?1.5:1.2;W('odds',om,'Odds');W('pass',1,'Point '+point+' made!');L('dontPass','Don\'t Pass');phase='comeout';point=null;}
  else if(seven){L('pass','Pass Line');L('odds','Odds');W('dontPass',1,'Don\'t Pass');phase='comeout';point=null;log.push('SEVEN OUT');
   shooter=(shooter+1)%4;log.push('Dice pass to '+(shooter===3?'you':bots[shooter].name));}
 }
 history=[];botsRefresh();updateBal();renderBets();
 if(won)pop('seatYou','+'+fmt(won),'#9ff0a8');else if(lost)pop('seatYou','-'+fmt(lost),'#ff9d9d');
 if(won){clack(5);sfx('chip-slide',.5);}
 setMsg('Rolled '+t+' ('+a+'+'+b+(hard&&[4,6,8,10].indexOf(t)>-1?', the hard way':'')+'). '+(log.length?log.join(' · '):'No action.'),won>lost?'win':(lost?'lose':''));}
