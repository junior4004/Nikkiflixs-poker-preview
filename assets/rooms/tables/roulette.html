<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NikkiFlixs Roulette</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(#1b1b1b,#050505);color:#fff;font-family:Georgia,serif;user-select:none;touch-action:manipulation}
.wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:6px;gap:5px}
.top{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;font-size:clamp(15px,2.4vh,22px)}
.bal{color:#ffd76a;font-weight:bold}
.main{flex:1;min-height:0;width:100%;max-width:1100px;display:flex;gap:8px;align-items:center;justify-content:center}
#wheel{width:min(80vh,44vw);height:min(80vh,44vw)}
@media (orientation:portrait){.main{flex-direction:column}#wheel{width:min(30vh,90vw);height:min(30vh,90vw);flex:none}.tb{overflow:hidden}}
.tb{flex:1;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center}
#tbl{background:#0c5a2c;border:6px solid #5a3317;border-radius:12px;box-shadow:inset 0 0 30px #000a;display:grid;gap:2px;padding:5px;max-width:100%;max-height:100%}
.c{display:flex;align-items:center;justify-content:center;border:1.5px solid #e8d9a8;border-radius:3px;font-weight:bold;position:relative;font-size:min(1em,2.2vh);overflow:visible}
.r{background:#b3121d}.b{background:#151515}.g{background:#0b7a35}
.c.win{outline:3px solid #ffd76a;box-shadow:0 0 14px 4px #ffd76a}
.chip{position:absolute;width:1.8em;height:1.8em;border-radius:50%;border:3px dashed #fff;display:flex;align-items:center;justify-content:center;font:bold 10px Arial;box-shadow:0 2px 3px #000;z-index:2;writing-mode:horizontal-tb}
.bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pc{width:clamp(42px,6.5vh,58px);height:clamp(42px,6.5vh,58px);border-radius:50%;border:4px dashed #fff;font:bold 14px Arial;color:#fff;box-shadow:0 3px 5px #000}
.pc.sel{transform:translateY(-6px);box-shadow:0 0 0 3px #ffd76a}
.btn{padding:clamp(8px,1.5vh,13px) 15px;border-radius:10px;border:2px solid #ffd76a;background:#1a1205;color:#ffd76a;font:bold clamp(14px,2.1vh,19px) Georgia}
.btn.spin{background:linear-gradient(#e8bd45,#9c7414);color:#1a1205}
.btn:disabled{opacity:.4}
#msg{min-height:1.3em;font-size:clamp(14px,2.3vh,20px);color:#ffd76a;text-align:center}
#hist span{display:inline-flex;width:1.7em;height:1.7em;border-radius:50%;align-items:center;justify-content:center;font:bold 12px Arial;margin-left:2px}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;z-index:9}
#pop div{background:#1a1205;border:3px solid #ffd76a;border-radius:14px;padding:22px;font-size:22px;text-align:center;max-width:85vw}
</style></head><body><div class="wrap">
<div class="top"><div>Roulette</div><div id="hist"></div><div>Gold: <span class="bal" id="bal">0</span></div></div>
<div class="main"><canvas id="wheel"></canvas><div class="tb"><div id="tbl"></div></div></div>
<div id="msg">Place your bets</div><div class="bar" id="chips"></div>
<div class="bar"><button class="btn" id="undo">Undo</button><button class="btn" id="clear">Clear</button><button class="btn" id="rebet">Rebet</button><button class="btn spin" id="spin">SPIN</button></div>
</div><div id="pop"><div id="poptxt"></div></div>
<script>
(function(){"use strict";
var BK='nikkiflixs_bankroll';
function lb(){try{var v=parseInt(localStorage.getItem(BK),10);return isNaN(v)?10000:v;}catch(e){return 10000;}}
var bal=lb();if(bal<=0&&!/^https?:/.test(location.protocol))bal=10000;function $(i){return document.getElementById(i);}
function sb(){$('bal').textContent=bal.toLocaleString();try{localStorage.setItem(BK,String(Math.max(0,Math.floor(bal))));}catch(e){}}sb();
var ORD=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
var RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
function cl(n){return n===0?'g':RED.indexOf(n)>=0?'r':'b';}
var CH=[[1,'#8a8a8a'],[5,'#c0121b'],[25,'#118a3a'],[100,'#151515'],[500,'#6a2a9a'],[1000,'#c98f0c']],cv=25;
function cc(v){var c=CH[0][1];CH.forEach(function(x){if(v>=x[0])c=x[1];});return c;}
function rg(a,b,f){var o=[];for(var i=a;i<=b;i++)if(!f||f(i))o.push(i);return o;}
var tbl=$('tbl'),cells={},bets={},stack=[],lastBets=null,spinning=false,PM=matchMedia('(orientation:portrait)');
function add(k,l,c,r,col,rs,cs,nums,pay,vert){var d=document.createElement('div');d.className='c '+c;d.textContent=l;d.style.gridArea=r+' / '+col+' / span '+rs+' / span '+cs;if(vert)d.style.writingMode='vertical-rl';tbl.appendChild(d);cells[k]={el:d,nums:nums,pay:pay};d.addEventListener('click',function(){place(k);});}
function fitT(){var r=tbl.parentNode.getBoundingClientRect(),w=Math.min(r.width-4,(r.height-4)*5/8);tbl.style.width=Math.floor(w)+'px';tbl.style.height=Math.floor(w*8/5)+'px';tbl.style.fontSize=Math.max(9,Math.floor(w/16))+'px';}
function build(){tbl.innerHTML='';cells={};var P=PM.matches,i,n;
var O=[['1-18','1-18',rg(1,18)],['EVEN','EVEN',rg(1,36,function(i){return i%2==0})],['RED','RED',RED],['BLACK','BLACK',rg(1,36,function(i){return RED.indexOf(i)<0})],['ODD','ODD',rg(1,36,function(i){return i%2})],['19-36','19-36',rg(19,36)]];
var D=[['D1','1st 12',rg(1,12)],['D2','2nd 12',rg(13,24)],['D3','3rd 12',rg(25,36)]];
var C=[['C1',rg(1,36,function(i){return i%3==1})],['C2',rg(1,36,function(i){return i%3==2})],['C3',rg(1,36,function(i){return i%3==0})]];
function oc(k){return k=='RED'?'r':k=='BLACK'?'b':'';}
if(P){tbl.style.gridTemplateColumns='.8fr .8fr 1fr 1fr 1fr';tbl.style.gridTemplateRows='repeat(14,1fr)';tbl.style.aspectRatio='5/8';tbl.style.aspectRatio='auto';fitT();
add('0','0','g',1,3,1,3,[0],35);
for(n=1;n<=36;n++)add(''+n,n,cl(n),2+Math.floor((n-1)/3),3+(n-1)%3,1,1,[n],35);
for(i=0;i<3;i++)add(D[i][0],D[i][1],'',2+i*4,2,4,1,D[i][2],2,1);
for(i=0;i<6;i++)add(O[i][0],O[i][1],oc(O[i][0]),2+i*2,1,2,1,O[i][2],1,1);
for(i=0;i<3;i++)add(C[i][0],'2:1','',14,3+i,1,1,C[i][1],2);
}else{tbl.style.gridTemplateColumns='repeat(14,1fr)';tbl.style.gridTemplateRows='repeat(5,1fr)';tbl.style.aspectRatio='14/6';tbl.style.width='100%';tbl.style.height='auto';
add('0','0','g',1,1,3,1,[0],35);
for(n=1;n<=36;n++)add(''+n,n,cl(n),3-(n-1)%3,2+Math.floor((n-1)/3),1,1,[n],35);
for(i=0;i<3;i++)add(C[i][0],'2:1','',3-i,14,1,1,C[i][1],2);
for(i=0;i<3;i++)add(D[i][0],D[i][1],'',4,2+i*4,1,4,D[i][2],2);
for(i=0;i<6;i++)add(O[i][0],O[i][1],oc(O[i][0]),5,2+i*2,1,2,O[i][2],1);}
draw();}
function draw(){for(var k in cells){var e=cells[k].el,o=e.querySelector('.chip');if(o)o.remove();if(bets[k]){var c=document.createElement('div');c.className='chip';c.style.background=cc(bets[k]);c.textContent=bets[k]>=1000?(bets[k]/1000)+'K':bets[k];e.appendChild(c);}}}
function tot(){var t=0;for(var k in bets)t+=bets[k];return t;}
function msg(t){$('msg').textContent=t;}
function pop(t){$('poptxt').innerHTML=t;$('pop').style.display='flex';clearTimeout(pop.t);pop.t=setTimeout(function(){$('pop').style.display='none';},2200);}
$('pop').onclick=function(){this.style.display='none';};
var AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC;}
function clack(vol,dur){var a=ac();if(!a)return;var len=Math.floor(a.sampleRate*(dur||.05)),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);var s=a.createBufferSource();s.buffer=b;var f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=1.2;var g=a.createGain();g.gain.value=vol||.5;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
function ub(){var u=$('undo'),c=$('clear'),off=spinning||!stack.length;u.disabled=off;c.disabled=off;u.style.opacity=c.style.opacity=off?.35:1;u.style.pointerEvents=c.style.pointerEvents=off?'none':'';}
function place(k){if(spinning){pop('Wait for the wheel to stop');return;}
if(cv>bal-tot()){pop(bal-tot()<=0?'You are out of gold coins':'Pick a smaller chip');return;}
bets[k]=(bets[k]||0)+cv;stack.push([k,cv]);clack(.6,.06);draw();ub();msg('Total bet: '+tot().toLocaleString());}
$('undo').onclick=function(){if(spinning||!stack.length)return;var s=stack.pop();bets[s[0]]-=s[1];if(bets[s[0]]<=0)delete bets[s[0]];draw();ub();msg('Total bet: '+tot().toLocaleString());};
$('clear').onclick=function(){if(spinning)return;bets={};stack=[];draw();ub();msg('Place your bets');};
$('rebet').onclick=function(){if(spinning||!lastBets)return;var t=0;for(var k in lastBets)t+=lastBets[k];if(t>bal){pop('Not enough gold coins to rebet');return;}bets=JSON.parse(JSON.stringify(lastBets));stack=[];for(k in bets)stack.push([k,bets[k]]);draw();ub();msg('Total bet: '+tot().toLocaleString());};
var cb=$('chips');CH.forEach(function(x){var b=document.createElement('button');b.className='pc'+(x[0]==cv?' sel':'');b.style.background=x[1];b.textContent=x[0]>=1000?'1K':x[0];b.onclick=function(){cv=x[0];Array.prototype.forEach.call(cb.children,function(e){e.classList.remove('sel');});b.classList.add('sel');clack(.4,.04);};cb.appendChild(b);});
var RS=null;function rollStart(){return;var a=ac();if(!a||RS)return;var len=a.sampleRate*2,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0),p=0;for(var i=0;i<len;i++){p=p*.96+(Math.random()*2-1)*.2;d[i]=p+(Math.random()*2-1)*.15;}
var s=a.createBufferSource();s.buffer=b;s.loop=true;var f=a.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;f.frequency.value=900;var f2=a.createBiquadFilter();f2.type='lowpass';f2.frequency.value=3000;var g=a.createGain();g.gain.value=0;var lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=14;lg.gain.value=0;lfo.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(f2);f2.connect(g);g.connect(a.destination);s.start();lfo.start();RS={s:s,f:f,g:g,lfo:lfo,lg:lg};}
function rollSet(v,on){if(!RS)return;var a=AC,t=a.currentTime,vol=on?Math.min(.4,.2+v*.02):0;RS.g.gain.setTargetAtTime(vol,t,.05);RS.lg.gain.setTargetAtTime(vol*.35,t,.05);RS.f.frequency.setTargetAtTime(650,t,.05);RS.lfo.frequency.setTargetAtTime(Math.min(9,5+v*.6),t,.05);}
function rollStop(){if(!RS)return;var r=RS;RS=null;r.g.gain.setTargetAtTime(0,AC.currentTime,.08);setTimeout(function(){try{r.s.stop();r.lfo.stop();}catch(e){}},600);}
var roll=0,prevA=null;
var cvs=$('wheel'),ctx=cvs.getContext('2d'),S=0,wa=0,ball=null,N=37,SEG=Math.PI*2/N,wheelImg=null;
function size(){var r=cvs.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);S=Math.round(r.width*d);cvs.width=cvs.height=S;wheelImg=null;}
function rend(){var c=document.createElement('canvas');c.width=c.height=S;var g=c.getContext('2d'),R=S/2;g.translate(R,R);
var w=g.createRadialGradient(0,0,R*.6,0,0,R);w.addColorStop(0,'#5a2e12');w.addColorStop(.6,'#8b4a1f');w.addColorStop(.85,'#3d1c08');w.addColorStop(1,'#1c0c03');g.fillStyle=w;g.beginPath();g.arc(0,0,R*.99,0,7);g.fill();
for(var k=0;k<14;k++){g.strokeStyle='rgba(255,220,170,'+(0.03+Math.random()*.04)+')';g.lineWidth=R*.01;g.beginPath();g.arc(0,0,R*(.8+Math.random()*.18),Math.random()*7,Math.random()*7);g.stroke();}
var tr=g.createRadialGradient(0,0,R*.7,0,0,R*.86);tr.addColorStop(0,'#2a1608');tr.addColorStop(.5,'#c8a878');tr.addColorStop(1,'#3a2210');g.fillStyle=tr;g.beginPath();g.arc(0,0,R*.86,0,7);g.arc(0,0,R*.72,0,7,true);g.fill();
for(var i=0;i<N;i++){var a0=i*SEG-Math.PI/2-SEG/2,n=ORD[i],col=n===0?'#0b8a3c':RED.indexOf(n)>=0?'#b0101a':'#111';
g.fillStyle=col;g.beginPath();g.arc(0,0,R*.72,a0,a0+SEG);g.arc(0,0,R*.5,a0+SEG,a0,true);g.fill();
g.save();g.rotate(a0+SEG/2+Math.PI/2);g.fillStyle='#fff';g.font='bold '+Math.round(R*.075)+'px Georgia';g.textAlign='center';g.textBaseline='middle';g.fillText(n,0,-R*.645);g.restore();}
g.strokeStyle='#e9e9ef';g.lineWidth=R*.012;for(i=0;i<N;i++){var a=i*SEG-Math.PI/2-SEG/2;g.beginPath();g.moveTo(Math.cos(a)*R*.5,Math.sin(a)*R*.5);g.lineTo(Math.cos(a)*R*.72,Math.sin(a)*R*.72);g.stroke();}
g.strokeStyle='#d4af37';g.lineWidth=R*.015;[.72,.59,.5].forEach(function(x){g.beginPath();g.arc(0,0,R*x,0,7);g.stroke();});
var cn=g.createRadialGradient(-R*.1,-R*.1,R*.02,0,0,R*.5);cn.addColorStop(0,'#b56a32');cn.addColorStop(.7,'#6b3412');cn.addColorStop(1,'#3a1a06');g.fillStyle=cn;g.beginPath();g.arc(0,0,R*.49,0,7);g.fill();
var ch=g.createLinearGradient(-R*.2,-R*.2,R*.2,R*.2);ch.addColorStop(0,'#fff');ch.addColorStop(.5,'#8a8a92');ch.addColorStop(1,'#f4f4f4');g.fillStyle=ch;
for(i=0;i<4;i++){g.save();g.rotate(i*Math.PI/2);g.beginPath();g.ellipse(0,-R*.2,R*.028,R*.2,0,0,7);g.fill();g.beginPath();g.arc(0,-R*.4,R*.035,0,7);g.fill();g.restore();}
g.beginPath();g.arc(0,0,R*.08,0,7);g.fill();g.fillStyle='#d4af37';g.beginPath();g.arc(0,0,R*.045,0,7);g.fill();
wheelImg=c;}
var spinState=null,last=performance.now(),idle=.15;
function ease(t){return 1-Math.pow(1-t,3);}
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;if(!S)size();if(!wheelImg)rend();var R=S/2;
if(spinState){var st=spinState,t=Math.min(1,(now-st.t0)/st.dur);wa=st.w0+(st.wf-st.w0)*ease(t);
var bt=Math.min(1,t/.82),ba=st.bf+st.K*(1-ease(bt)),br;
if(bt<.55)br=R*.79;else if(bt<1){var p=(bt-.55)/.45;br=R*(.79-(.79-.61)*p)+Math.abs(Math.sin(p*Math.PI*4))*R*.05*(1-p);
if(!st.bn)st.bn=0;var nb=Math.floor(p*4);if(nb>st.bn){st.bn=nb;clack(.35*(1-p)+.1,.03);}}else{var q=Math.min(1,(t-.82)/.18/.6);br=R*.61;if(q<1){var nbn=Math.floor(q*4);br+=Math.abs(Math.sin(q*Math.PI*4))*R*.04*(1-q);if(nbn>(st.bb||0)){st.bb=nbn;clack(.3*(1-q)+.08,.03);}}}
ball={a:bt>=1?wa+st.pa:ba,r:br};
var va=prevA==null?0:Math.abs(ball.a-prevA)/Math.max(dt,.001),rel=Math.abs(va-(st.wf-st.w0)/st.dur*1000*3*Math.pow(1-t,2));prevA=ball.a;roll+=va*dt*9;
if(bt<1){st.ck=(st.ck||0)+dt*Math.min(16,4+va*1.2);if(st.ck>=1){st.ck=0;clack(.14+Math.random()*.08,.02);}}
if(t>=1){spinState=null;prevA=null;rollStop();finish(st.res);}}else{wa+=idle*dt;if(ball&&ball.land)ball.a=wa+ball.pa;}
ctx.clearRect(0,0,S,S);ctx.save();ctx.translate(R,R);ctx.rotate(wa);ctx.drawImage(wheelImg,-R,-R);ctx.restore();
if(ball){var x=R+Math.cos(ball.a-Math.PI/2)*ball.r,y=R+Math.sin(ball.a-Math.PI/2)*ball.r,br2=R*.032;ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.arc(x+br2*.3,y+br2*.4,br2,0,7);ctx.fill();var bg=ctx.createRadialGradient(x-br2*.4,y-br2*.4,br2*.1,x,y,br2);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#bbb');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,br2,0,7);ctx.fill();
if(spinState){for(var m=0;m<2;m++){var ra=roll+m*Math.PI,cx=Math.cos(ra);if(cx>-.2){var ox=x+Math.cos(ball.a)*Math.sin(ra)*br2*.6,oy=y+Math.sin(ball.a)*Math.sin(ra)*br2*.6;ctx.fillStyle='rgba(120,120,130,'+(.5*cx+.1)+')';ctx.beginPath();ctx.ellipse(ox,oy,br2*.28,br2*.28*Math.max(.25,cx),ball.a,0,7);ctx.fill();}}}
ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x-br2*.35,y-br2*.35,br2*.22,0,7);ctx.fill();}
requestAnimationFrame(frame);}
function rnd(n){try{var u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n;}catch(e){return Math.floor(Math.random()*n);}}
$('spin').onclick=function(){if(spinning)return;var t=tot();if(t<=0){pop('Place a bet first');return;}if(t>bal){pop('You are out of gold coins');return;}
ac();spinning=true;stack=[];ub();bal-=t;sb();lastBets=JSON.parse(JSON.stringify(bets));clearWin();
var idx=rnd(N),res=ORD[idx],pa=idx*SEG,w0=wa,wf=w0+Math.PI*2*(2+Math.random());
spinState={t0:performance.now(),dur:9000,w0:w0,wf:wf,res:res,pa:pa,bf:wf+pa,K:-Math.PI*2*(8+rnd(3)),bn:0};
ball={a:0,r:S*.4};prevA=null;rollStart();$('spin').disabled=true;msg('No more bets');clack(.3,.2);};
function clearWin(){for(var k in cells)cells[k].el.classList.remove('win');}
var hist=[];
function finish(res){ball={land:1,pa:spinState?0:ball.a-wa,r:S/2*.61};ball.a=wa+ball.pa;
var win=0;for(var k in bets){var c=cells[k];if(c&&c.nums.indexOf(res)>=0)win+=bets[k]*(c.pay+1);}
bal+=win;sb();clack(.7,.08);if(cells[''+res])cells[''+res].el.classList.add('win');
hist.unshift(res);hist=hist.slice(0,8);$('hist').innerHTML=hist.map(function(n){return '<span style="background:'+(n===0?'#0b8a3c':RED.indexOf(n)>=0?'#b0101a':'#111')+'">'+n+'</span>';}).join('');
var cn=res===0?'Green':RED.indexOf(res)>=0?'Red':'Black';
pop('<b style="font-size:40px">'+res+'</b><br>'+cn+'<br>'+(win>0?'You win '+win.toLocaleString()+' gold!':'No win this spin'));
msg(win>0?'Won '+win.toLocaleString()+' on '+res+' '+cn:res+' '+cn+' - place your bets');
bets={};stack=[];draw();spinning=false;ub();$('spin').disabled=false;}
window.addEventListener('resize',function(){size();build();});PM.addEventListener&&PM.addEventListener('change',function(){size();build();});
build();size();requestAnimationFrame(frame);
ub();
})();
</script></body></html>
