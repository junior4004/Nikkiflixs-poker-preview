<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 HD 3D Poker Racetrack Table</title>
  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* CONTAINER & TABLE WRAPPER */
    .poker-stage {
      position: relative;
      width: 95vw;
      max-width: 1100px;
      height: 60vh;
      max-height: 650px;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3D RACETRACK TABLE STRUCTURE */
    .poker-table-3d {
      position: relative;
      width: 100%;
      height: 100%;
      background: #362211; /* Outer wood/leather bumper base */
      border-radius: 200px;
      transform: rotateX(28deg);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.9),
        inset 0 0 25px rgba(0, 0, 0, 0.8),
        inset 0 0 0 16px #1a0f07, /* Leather rail rim */
        inset 0 0 0 32px #4a2e12; /* Mahogany racetrack wood */
      border: 4px solid #633e19;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    /* FELT SURFACE */
    .table-felt {
      position: absolute;
      width: calc(100% - 100px);
      height: calc(100% - 100px);
      border-radius: 160px;
      background: radial-gradient(ellipse at center, #15803d 0%, #166534 60%, #052e16 100%);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* CENTER BOARD & CARDS */
    .pot-container {
      position: absolute;
      top: 22%;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fde047;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 16px;
      border-radius: 20px;
      border: 1px solid rgba(253, 224, 71, 0.3);
    }

    .community-cards {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .card {
      width: 48px;
      height: 68px;
      background: #ffffff;
      border-radius: 6px;
      color: #111827;
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
    }
    .card.red { color: #dc2626; }
    .card.mucked {
      transform: translateY(-80px) scale(0.2) rotate(15deg);
      opacity: 0;
    }

    /* PLAYER SEATS */
    .seat {
      position: absolute;
      width: 80px;
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* Positioning 8 seats around the racetrack */
    .seat-1 { bottom: -25px; left: 50%; transform: translateX(-50%); }
    .seat-2 { bottom: 10%; left: 18%; }
    .seat-3 { top: 50%; left: -25px; transform: translateY(-50%); }
    .seat-4 { top: 10%; left: 18%; }
    .seat-5 { top: -25px; left: 50%; transform: translateX(-50%); }
    .seat-6 { top: 10%; right: 18%; }
    .seat-7 { top: 50%; right: -25px; transform: translateY(-50%); }
    .seat-8 { bottom: 10%; right: 18%; }

    /* AVATAR & ACTION TIMER */
    .avatar-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #1f2937;
      border: 3px solid #4b5563;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .seat.active .avatar-wrapper {
      border-color: #f59e0b;
      box-shadow: 0 0 15px #f59e0b;
    }

    /* SVG Timer Ring */
    .timer-svg {
      position: absolute;
      top: -5px;
      left: -5px;
      width: 68px;
      height: 68px;
      transform: rotate(-90deg);
      pointer-events: none;
    }
    .timer-circle {
      fill: none;
      stroke: #f59e0b;
      stroke-width: 4;
      stroke-dasharray: 188;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .player-info {
      background: rgba(17, 24, 39, 0.9);
      border-radius: 8px;
      padding: 2px 8px;
      text-align: center;
      margin-top: 4px;
      font-size: 0.75rem;
      border: 1px solid #374151;
      width: 90px;
    }
    .player-name { font-weight: 600; color: #d1d5db; }
    .player-chips { color: #34d399; font-weight: 700; }

    /* CONTROLS BAR */
    .controls {
      margin-top: 30px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(37, 99, 235, 0.4);
    }
    button:active { transform: translateY(0); }
    button.btn-check { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
    button.btn-fold { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); }

    /* RESPONSIVE ADJUSTMENTS */
    @media (max-width: 768px) {
      .poker-table-3d { transform: rotateX(20deg) scale(0.85); }
      .seat { width: 65px; height: 65px; }
      .card { width: 38px; height: 54px; font-size: 0.85rem; }
    }
  </style>
</head>
